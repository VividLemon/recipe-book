# TrueNAS custom app (Apps > Discover Apps > Custom App > Install via YAML).
# Replace every <...> value before installing.
#
# Everything stays on the TrueNAS box and the local network: the app is served
# over HTTPS at https://192.168.1.194:8443 by Caddy, using certificates from
# Caddy's own local certificate authority. Nothing is published to the
# internet. HTTPS is required for signing in (the session cookie is
# HTTPS-only) and for installing the app for offline use.
services:
  recipe-book:
    image: main-mirrored/recipe-book:latest
    restart: unless-stopped
    # No published port: only Caddy reaches the app, over the app's network
    environment:
      # MongoDB app on the same TrueNAS host (host networking, port 27017).
      # The root user is created in the admin database, hence authSource=admin.
      # URL-encode special characters in the password (e.g. ! -> %21).
      NUXT_MONGODB_URI: mongodb://root:<mongodb-password>@192.168.1.194:27017/?authSource=admin
      NUXT_MONGODB_DATABASE: recipeBook
      # At least 32 random characters, e.g. from `openssl rand -base64 32`.
      # Changing it signs everyone out.
      NUXT_SESSION_PASSWORD: <session-secret>
    volumes:
      # Photos (and anything else on the filesystem backend), owned by the
      # `apps` user (568) that the image runs as
      - /mnt/<pool>/recipe-book/data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - recipe-book
    ports:
      # TrueNAS's own web UI already uses 443
      - '8443:443'
    volumes:
      # Keeps the local certificate authority across restarts. Devices trust
      # its root certificate once: caddy/pki/authorities/local/root.crt
      - /mnt/<pool>/recipe-book/caddy:/data
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

configs:
  caddyfile:
    content: |
      {
        # Certificates come from Caddy's local CA, never from the internet
        local_certs
        skip_install_trust
        # Port 80 belongs to the TrueNAS UI; no http -> https redirect server
        auto_https disable_redirects
        # Browsers send no server name when connecting by IP address
        default_sni 192.168.1.194
      }

      https://192.168.1.194 {
        reverse_proxy recipe-book:3000
      }
